name: Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.apk"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate APK and compute release metadata
        id: meta
        shell: bash
        run: |
          apk_file=$(ls -1 *.apk | sort -V | tail -n 1)
          if [ -z "$apk_file" ]; then
            echo "No root APK file found."
            exit 1
          fi

          raw_ver=$(echo "$apk_file" | sed -E 's/.*_v([0-9]+(\.[0-9]+)*)\.apk$/\1/')
          if echo "$raw_ver" | grep -q '\.'; then
            tag="v$raw_ver"
          elif echo "$raw_ver" | grep -Eq '^[0-9]{3,}$'; then
            num=$((10#$raw_ver))
            major=$((num / 100))
            minor=$((num % 100))
            tag=$(printf "v%d.%02d" "$major" "$minor")
          else
            tag="v${raw_ver}"
          fi

          sha=$(sha256sum "$apk_file" | awk '{print $1}')
          echo "apk_file=$apk_file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Octgm Flow ${{ steps.meta.outputs.tag }}"
          files: ${{ steps.meta.outputs.apk_file }}
          overwrite_files: true
          make_latest: true
          body: |
            Octgm Flow ${{ steps.meta.outputs.tag }}
            `${{ steps.meta.outputs.apk_file }}` sha256: `${{ steps.meta.outputs.sha256 }}`
